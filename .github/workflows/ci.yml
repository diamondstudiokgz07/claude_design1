name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dostuk
          POSTGRES_PASSWORD: dostuk
          POSTGRES_DB: dostuk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dostuk" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create app role (no BYPASSRLS)
        run: PGPASSWORD=dostuk psql -h localhost -U dostuk -d dostuk_test -c "CREATE ROLE dostuk_app LOGIN PASSWORD 'dostuk_app' NOBYPASSRLS"
      - run: pip install ".[dev]" ruff
      - run: ruff check app worker tests --select F,E9,B --ignore B008
      - run: pytest -q

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dostuk-api:${{ github.sha }} .
      # Дальше: push в registry → на сервере `docker compose pull && docker compose up -d`
      # (migrate выполняется перед api; uvicorn перезапускается без простоя через healthcheck).
