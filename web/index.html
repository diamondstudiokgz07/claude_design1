<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Достук 3.0 — тест-консоль</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a00%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3E%D0%94%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #e4e0d8;
  --accent: #ff7a00; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --info: #2b6cb0;
  --chip: #f0ede7; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#151412; --panel:#1f1d1a; --ink:#f1eee8; --muted:#a29c92; --line:#34312c; --chip:#2a2824;
          --shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
h1, h2, h3 { margin: 0 0 .5em; line-height: 1.2; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { padding: 3px 8px; font-size: 13px; }
button:disabled { opacity: .5; cursor: progress; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label > input, label > select, label > textarea { color: var(--ink); font-size: 15px; }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row.center { align-items: center; }
.grow { flex: 1; }
.muted { color: var(--muted); font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; }
.chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.chip.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
table.list { width: 100%; border-collapse: collapse; }
table.list td, table.list th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.list th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
.brand { font-weight: 700; } .brand b { color: var(--accent); }
nav.tabs { display: flex; gap: 4px; padding: 0 12px; overflow-x: auto; }
nav.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 12px; }
nav.tabs button.active { border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--bad); }
.dot.on { background: var(--ok); } .dot.wait { background: var(--warn); }

.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

.tables { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.tbl { aspect-ratio: 1.2; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
       border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
.tbl.busy { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.tbl.billed { border-color: var(--info); }
.tbl.sel { outline: 3px solid var(--ink); }
.tbl .n { font-size: 22px; font-weight: 700; }

.menu-items { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.mi { text-align: left; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; white-space: normal; }
.mi.off { opacity: .45; text-decoration: line-through; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }

.kds { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.ticket { border-top: 5px solid var(--accent); }
.ticket .it { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.ticket .it.cooking .nm { color: var(--warn); } .ticket .it.ready .nm { color: var(--ok); }
.timer { font-variant-numeric: tabular-nums; }
.timer.late { color: var(--bad); font-weight: 700; }

.pinpad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.pinpad button { height: 56px; font-size: 22px; }
.pin-dots { text-align: center; font-size: 28px; letter-spacing: 8px; min-height: 40px; }

#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; }
.toast.err { background: var(--bad); color: #fff; }
.log { max-height: 60vh; overflow: auto; }
.log .ev { border-bottom: 1px solid var(--line); padding: 6px 0; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); color: var(--ink); padding: 18px; max-width: min(560px, 94vw); width: 100%; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.receipt { background: #fffdf6; color: #222; font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px dashed #ccc; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
// ============================================================================
// Состояние и хранение. sessionStorage — у каждой вкладки своё «устройство»,
// поэтому в соседних вкладках можно одновременно войти официантом, поваром и кассиром.
// ============================================================================
const store = {
  get(k, d = null) { try { const v = sessionStorage.getItem("dostuk." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v === null ? sessionStorage.removeItem("dostuk." + k) : sessionStorage.setItem("dostuk." + k, JSON.stringify(v)); } catch {} },
};
const S = {
  base: store.get("base", location.origin.startsWith("http") ? location.origin : "http://localhost:8000"),
  lang: store.get("lang", "ru"),
  access: store.get("access"), refresh: store.get("refresh"), device: store.get("device"),
  me: null, tab: store.get("tab"), since: store.get("since", 0),
  stations: store.get("kdsStations", []),
  selTable: null, selOrder: null, cart: [],
  cache: {},
};
const API = () => S.base.replace(/\/$/, "") + "/api/v1";
const can = p => !!S.me && S.me.permissions.includes(p);

// ============================================================================
// DOM-помощники (без innerHTML для данных — защита от XSS)
// ============================================================================
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = sel => document.querySelector(sel);
const money = t => (t / 100).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " с";
const toTyiyn = s => Math.round(parseFloat(String(s).replace(",", ".")) * 100) || 0;
const short = id => id ? String(id).slice(0, 8) : "—";
const tm = iso => iso ? new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "";
const val = id => document.getElementById(id)?.value?.trim() ?? "";

function toast(msg, err = false) {
  const t = h("div", { class: "toast" + (err ? " err" : "") }, msg);
  $("#toasts").append(t);
  setTimeout(() => t.remove(), err ? 6000 : 3000);
}

// Кнопка с асинхронным действием: блокируется на время запроса, ошибки — в тост
function btn(label, fn, cls = "") {
  const b = h("button", { class: cls });
  b.append(label);
  b.addEventListener("click", async e => {
    e.preventDefault();
    b.disabled = true;
    try { await fn(e); } catch (err) { if (err && err.message) toast(err.message, true); }
    finally { b.disabled = false; }
  });
  return b;
}

const STATUS = {
  queued: ["в очереди", ""], cooking: ["готовится", "warn"], ready: ["готово", "ok"], served: ["отдано", "info"],
  cancelled: ["отменено", "bad"], open: ["открыт", "warn"], billed: ["пречек", "info"], paid: ["оплачен", "ok"],
  pending: ["ждёт подтверждения", "bad"],
};
const chip = s => h("span", { class: "chip " + (STATUS[s]?.[1] || "") }, STATUS[s]?.[0] || s);

// ============================================================================
// HTTP: токены, обновление, Idempotency-Key, единый формат ошибок
// ============================================================================
class ApiError extends Error {
  constructor(status, body) {
    super((body && body.message ? body.message : "HTTP " + status) + (body && body.code ? ` [${body.code}]` : ""));
    this.status = status; this.body = body;
  }
}
let refreshing = null;

async function api(method, path, body, opt = {}) {
  const headers = { "Accept-Language": S.lang };
  if (S.access && !opt.noAuth) headers.Authorization = "Bearer " + S.access;
  if (opt.device) headers["X-Device-Token"] = S.device?.token || "";
  if (["POST", "PUT", "PATCH", "DELETE"].includes(method)) headers["Idempotency-Key"] = crypto.randomUUID();
  let payload;
  if (opt.form) payload = opt.form;
  else if (body !== undefined) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  const res = await fetch(API() + path, { method, headers, body: payload });
  if (res.status === 401 && !opt.noAuth && !opt.retried && S.refresh) {
    const data = await res.clone().json().catch(() => ({}));
    if (data.code === "token_expired" && await doRefresh()) return api(method, path, body, { ...opt, retried: true });
    if (data.code !== "token_expired") { logoutLocal(data.message || "Сессия завершена"); }
  }
  if (opt.raw) { if (!res.ok) throw new ApiError(res.status, await res.json().catch(() => null)); return res; }
  const text = await res.text();
  const data = text ? (() => { try { return JSON.parse(text); } catch { return text; } })() : null;
  if (!res.ok) throw new ApiError(res.status, data);
  return data;
}

async function doRefresh() {
  if (!S.refresh) return false;
  refreshing ??= (async () => {
    try {
      const t = await api("POST", "/auth/refresh", { refresh_token: S.refresh }, { noAuth: true });
      setTokens(t); return true;
    } catch { logoutLocal("Сессия истекла — войдите снова"); return false; }
    finally { setTimeout(() => (refreshing = null), 0); }
  })();
  return refreshing;
}

function setTokens(t) {
  S.access = t.access_token; S.refresh = t.refresh_token;
  store.set("access", S.access); store.set("refresh", S.refresh);
}

function logoutLocal(msg) {
  S.access = S.refresh = S.me = null;
  store.set("access", null); store.set("refresh", null);
  ws.stop();
  if (msg) toast(msg, true);
  render();
}

// ============================================================================
// WebSocket: подписка, добор по since, переподключение, обновление по токену
// ============================================================================
const ws = {
  sock: null, state: "off", backoff: 1000, timer: null, log: [],
  start() {
    this.stop(true);
    if (!S.access) return;
    const u = new URL(API().replace(/^http/, "ws") + "/ws");
    u.searchParams.set("token", S.access);
    u.searchParams.set("since", S.since || 0);
    if (S.tab === "kitchen" && S.stations.length) u.searchParams.set("stations", S.stations.join(","));
    this.setState("wait");
    const sock = new WebSocket(u);
    this.sock = sock;
    sock.onopen = () => { this.backoff = 1000; this.setState("on"); };
    sock.onmessage = e => this.onEvent(JSON.parse(e.data));
    sock.onclose = async e => {
      if (this.sock !== sock) return;
      this.setState("off");
      if (!S.access) return;
      if (e.code === 4001) await doRefresh();      // токен истёк — обновить и переподключиться
      if (e.code === 4003) { logoutLocal("Сессия отозвана администратором"); return; }
      this.timer = setTimeout(() => this.start(), this.backoff);
      this.backoff = Math.min(this.backoff * 2, 15000);
    };
  },
  stop(keep) {
    clearTimeout(this.timer);
    if (this.sock) { const s = this.sock; this.sock = null; s.close(); }
    if (!keep) this.setState("off");
  },
  setState(s) { this.state = s; const d = $("#wsdot"); if (d) d.className = "dot " + s; const l = $("#wslabel"); if (l) l.textContent = { on: "онлайн", wait: "подключение…", off: "нет связи" }[s]; },
  onEvent(ev) {
    if (ev.type === "PING") return;
    if (ev.seq) { S.since = Math.max(S.since, ev.seq); store.set("since", S.since); }
    this.log.unshift({ at: new Date(), ev });
    this.log.length = Math.min(this.log.length, 300);
    if (ev.type === "ITEMS_ADDED" && S.tab === "kitchen") beep();
    if (ev.type === "ITEM_STATUS" && ev.data.status === "ready" && S.me && ev.data && S.tab === "floor") toast(`Готово: ${ev.data.name} ×${ev.data.quantity} (заказ №${ev.data.order_number})`);
    if (ev.type === "WAITER_CALLED") toast(`Стол ${ev.data.table_name}: ${ev.data.reason === "bill" ? "просят счёт" : "зовут официанта"}`);
    if (ev.type === "SECURITY_ALERT") toast(`Безопасность: ${ev.data.kind} (${ev.data.device_name || ""})`, true);
    if (ev.type === "SESSION_REVOKED") logoutLocal("Сессия отозвана");
    scheduleRefresh();
  },
};
let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { if (S.access && S.me && views[S.tab]?.live) renderTab(true); }, 250);
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch {}
}

// ============================================================================
// Экран входа
// ============================================================================
async function renderLogin(root) {
  const serverCard = h("div", { class: "card stack" },
    h("h2", {}, "Сервер"),
    h("div", { class: "row" },
      h("label", { class: "grow" }, "Адрес backend", h("input", { id: "base", value: S.base })),
      h("label", {}, "Язык ошибок", h("select", { id: "lang", onchange: e => { S.lang = e.target.value; store.set("lang", S.lang); } },
        h("option", { value: "ru", selected: S.lang === "ru" }, "Русский"), h("option", { value: "ky", selected: S.lang === "ky" }, "Кыргызча"))),
      btn("Проверить", async () => {
        S.base = val("base"); store.set("base", S.base);
        const r = await fetch(S.base.replace(/\/$/, "") + "/health").then(r => r.json()).catch(() => null);
        toast(r?.status === "ok" ? "Сервер доступен: БД и Redis в порядке" : "Сервер недоступен", r?.status !== "ok");
      })),
    h("div", { class: "muted" }, "Если консоль открыта с самого сервера (/app/), адрес уже правильный."));

  const ownerCard = h("div", { class: "card stack" },
    h("h2", {}, "Владелец / админ"),
    h("div", { class: "muted" }, "Email или телефон + пароль (+ код 2FA, если включён)."),
    h("label", {}, "Email или телефон", h("input", { id: "login", autocomplete: "username" })),
    h("label", {}, "Пароль", h("input", { id: "password", type: "password", autocomplete: "current-password" })),
    h("label", {}, "Код 2FA (если включён)", h("input", { id: "totp", inputmode: "numeric" })),
    btn("Войти", async () => {
      S.base = val("base"); store.set("base", S.base);
      const login = val("login");
      const body = { password: val("password") };
      if (login.includes("@")) body.email = login; else body.phone = login;
      if (val("totp")) body.totp_code = val("totp");
      setTokens(await api("POST", "/auth/login", body, { noAuth: true }));
      await afterLogin();
    }, "primary"));

  const deviceCard = h("div", { class: "card stack" }, h("h2", {}, "Устройство (официант, кухня, касса)"));
  if (!S.device) {
    deviceCard.append(
      h("div", { class: "muted" }, "1) Админ создаёт код во вкладке «Персонал → Устройства». 2) Введите код здесь — эта вкладка браузера станет привязанным устройством."),
      h("label", {}, "Код привязки", h("input", { id: "pair", placeholder: "ABCD2345", style: "text-transform:uppercase;letter-spacing:2px" })),
      btn("Привязать устройство", async () => {
        S.base = val("base"); store.set("base", S.base);
        const r = await api("POST", "/auth/device/pair", { code: val("pair"), platform: "web-test", app_version: "3.0.0" }, { noAuth: true });
        S.device = { token: r.device_token, name: r.device.name, kind: r.device.kind, venue: r.venue.name };
        store.set("device", S.device); toast("Устройство привязано: " + r.device.name); render();
      }, "primary"));
  } else {
    deviceCard.append(h("div", { class: "row center" },
      h("span", {}, `«${S.device.name}» · ${S.device.kind} · ${S.device.venue}`), h("span", { class: "grow" }),
      btn("Отвязать в этом браузере", () => { S.device = null; store.set("device", null); render(); }, "small danger")));
    const list = h("div", { class: "row" }, h("span", { class: "muted" }, "Загрузка сотрудников…"));
    deviceCard.append(h("h3", {}, "Кто вы?"), list, h("div", { id: "pinbox" }));
    api("GET", "/auth/device/staff", undefined, { device: true, noAuth: true }).then(staff => {
      list.replaceChildren(...(staff.length ? staff.map(s => h("button", { onclick: () => pinPad(s) }, s.name))
        : [h("span", { class: "muted" }, "Нет сотрудников с PIN-кодом")]));
    }).catch(e => { list.replaceChildren(h("span", { class: "muted" }, e.message)); if (e.status === 401) { S.device = null; store.set("device", null); } });
  }

  root.replaceChildren(h("main", { class: "stack", style: "max-width:980px" },
    h("h1", {}, h("span", { class: "brand" }, h("b", {}, "Достук"), " 3.0"), " ", h("span", { class: "muted" }, "тест-консоль backend")),
    serverCard, h("div", { class: "grid", style: "grid-template-columns:repeat(auto-fit,minmax(300px,1fr))" }, ownerCard, deviceCard)));
}

function pinPad(staff) {
  let pin = "";
  const dots = h("div", { class: "pin-dots" }, "—");
  const upd = () => { dots.textContent = pin ? "•".repeat(pin.length) : "—"; };
  const press = d => { if (pin.length < 8) { pin += d; upd(); } };
  const submit = async () => {
    try {
      setTokens(await api("POST", "/auth/pin", { staff_id: staff.id, pin }, { device: true, noAuth: true }));
      await afterLogin();
    } catch (e) { toast(e.message, true); pin = ""; upd(); }
  };
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map(d => h("button", { onclick: () => press(d) }, d));
  keys.push(h("button", { onclick: () => { pin = pin.slice(0, -1); upd(); } }, "⌫"), h("button", { onclick: () => press("0") }, "0"),
    h("button", { class: "primary", onclick: submit }, "OK"));
  $("#pinbox").replaceChildren(h("div", { class: "stack", style: "margin-top:12px" },
    h("div", { style: "text-align:center" }, h("b", {}, staff.name), " — введите PIN"), dots, h("div", { class: "pinpad" }, keys)));
  document.onkeydown = e => {
    if (!$("#pinbox")) { document.onkeydown = null; return; }

// Сохранение введённого при перерисовке. Каждое изменение поля получает номер (data-dirty = tick).
// Перерисовка переносит в новую разметку: всё, что пользователь ввёл ПОСЛЕ её старта (всегда),
// и вообще всё введённое — если это обновление по событию WebSocket (preserve=true).
// Перерисовка после действия (оплата и т.п.) стартует после ввода и поэтому сбрасывает форму.
let editTick = 0;
const markDirty = e => { if (e.target.closest?.("#view")) e.target.dataset.dirty = String(++editTick); };
document.addEventListener("input", markDirty);
document.addEventListener("change", markDirty);

// Перерисовки могут идти параллельно (действие + событие WebSocket). Каждая получает номер;
// более старая, закончившая позже новой, отбрасывается и не затирает свежий экран.
let renderSeq = 0, renderApplied = 0;
async function renderTab(preserve = false) {
  const view = $("#view");
  if (!view) return;
  const my = ++renderSeq;
  const startTick = editTick;
  try {
    const node = await views[S.tab].render();
    if ($("#view") !== view || my < renderApplied) return;
    renderApplied = my;
    const saved = {};
    for (const el of view.querySelectorAll("[data-dirty][id]")) {
      if (el.type === "checkbox" || !(preserve || +el.dataset.dirty > startTick)) continue;
      saved[el.id] = { v: el.multiple ? [...el.selectedOptions].map(o => o.value) : el.value, t: el.dataset.dirty };
    }
    const focused = view.contains(document.activeElement) ? document.activeElement.id : null;
    view.replaceChildren(node);
    for (const [id, { v, t }] of Object.entries(saved)) {
      const el = document.getElementById(id);
      if (!el) continue;
      if (el.multiple) [...el.options].forEach(o => (o.selected = v.includes(o.value))); else el.value = v;
      el.dataset.dirty = t;
    }
    if (focused) document.getElementById(focused)?.focus();
  } catch (e) { view.replaceChildren(h("div", { class: "card" }, "Ошибка: " + e.message)); }
}

function modal(title, body, actions) {
  const d = $("#dlg");
  d.replaceChildren(h("h2", {}, title), body, h("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" },
    h("button", { onclick: () => d.close() }, "Закрыть"), actions || []));
  d.showModal();
  return d;
}

async function printQueue() {

  return h("div", { class: "card stack" }, h("h2", {}, "Очередь печати ", h("span", { class: "chip" }, jobs.length)),
    h("div", { class: "muted" }, "Здесь «Касса» печатает ESC/POS на принтеры. В прототипе — показываем текст и подтверждаем."),
    jobs.length ? jobs.map(j => h("div", { class: "stack", style: "border-top:1px solid var(--line);padding-top:8px" },
      h("div", { class: "row center" }, h("b", {}, { kitchen_ticket: "Кухонный бегунок", precheck: "Пречек", receipt: "Чек", x_report: "X-отчёт", z_report: "Z-отчёт" }[j.kind] || j.kind),
        h("span", { class: "muted" }, tm(j.created_at)), h("span", { class: "grow" }),
        btn("Напечатано", async () => { await api("POST", `/print-jobs/${j.id}/ack`, { ok: true }); renderTab(); }, "small primary"),
        btn("Ошибка", async () => { await api("POST", `/print-jobs/${j.id}/ack`, { ok: false, error: "нет бумаги" }); renderTab(); }, "small")),
      h("pre", { class: "receipt" }, receiptText(j)))) : h("div", { class: "muted" }, "Пусто"));

function receiptText(j) {
  const p = j.payload; const L = [];
  if (j.kind === "kitchen_ticket") {
    L.push(`== ${p.station} ==`, `Заказ №${p.order_number}  ${p.table ? "Стол " + p.table : "С собой"}`, `Официант: ${p.waiter || "-"}`, "");
    for (const i of p.items) { L.push(`${i.qty} x ${i.name}`); if (i.modifiers?.length) L.push("   + " + i.modifiers.join(", ")); if (i.comment) L.push("   ! " + i.comment); }
  } else if (j.kind === "precheck" || j.kind === "receipt") {
    if (p.header) L.push(p.header); L.push(p.venue || "", p.legal_name ? `${p.legal_name} ИНН ${p.tax_id || ""}` : "", "");
    L.push(`${j.kind === "receipt" ? "ЧЕК" : "ПРЕЧЕК"} №${p.order_number}  ${p.table ? "Стол " + p.table : ""}`, "-".repeat(32));
    for (const i of p.items) L.push(`${i.qty} x ${i.name}`.padEnd(22) + money(i.total).padStart(10));
    L.push("-".repeat(32));
    if (p.discount) L.push("Скидка".padEnd(22) + ("-" + money(p.discount)).padStart(10));
    if (p.service_charge) L.push("Обслуживание".padEnd(22) + money(p.service_charge).padStart(10));
    L.push("ИТОГО".padEnd(22) + money(p.total).padStart(10));
    for (const pay of p.payments || []) L.push(`  ${pay.method}`.padEnd(22) + money(pay.amount).padStart(10));
    if (p.footer) L.push("", p.footer);
  } else {
    L.push(`${j.kind === "z_report" ? "Z" : "X"}-ОТЧЁТ  смена №${p.number}`, `Выручка: ${money(p.revenue)}`);
    for (const [k, v] of Object.entries(p.by_method || {})) L.push(`  ${k}: ${money(v)}`);
    L.push(`Ожидается наличных: ${money(p.expected_cash)}`);
  }
  return L.filter(x => x !== "").join("\n");
}

  const terrace = await P("/halls", { name: "Терраса" });
  for (const n of ["1", "2", "3", "4", "5", "6"]) await P("/tables", { hall_id: hall.id, name: n, seats: 4 });
  for (const n of ["Т1", "Т2"]) await P("/tables", { hall_id: terrace.id, name: n, seats: 6 });
  const roles = Object.fromEntries((await api("GET", "/roles")).map(r => [r.name, r.id]));
  await P("/staff", { name: "Официант Айбек", role_id: roles.waiter, pin: "1111" });
  await P("/staff", { name: "Повар Нурлан", role_id: roles.cook, pin: "2222" });
  await P("/staff", { name: "Кассир Айгуль", role_id: roles.cashier, pin: "3333" });
  dropCache("cats", "items", "groups");
  toast("Демо-данные созданы. Теперь создайте коды привязки во вкладке «Персонал».");
}

window.addEventListener("focus", () => { if (S.access && S.me && ws.state === "off") ws.start(); });
render();
</script>
