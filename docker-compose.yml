# Достук 3.0 — один VPS, Docker Compose.
# Перед первым запуском: cp .env.example .env и заполнить секреты.
name: dostuk

x-app: &app
  build: .
  image: dostuk-api:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      MENU_DOMAIN: ${MENU_DOMAIN:-menu.localhost}
      FILES_DOMAIN: ${FILES_DOMAIN:-files.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["arq", "worker.main.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dostuk
      POSTGRES_USER: dostuk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dostuk -d dostuk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DOSTUK_S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${DOSTUK_S3_SECRET_KEY:?set DOSTUK_S3_SECRET_KEY}
    volumes: [minio_data:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${DOSTUK_S3_ACCESS_KEY:-minio} $${DOSTUK_S3_SECRET_KEY}; do sleep 2; done;
      mc mb --ignore-existing local/dostuk;
      mc anonymous set download local/dostuk/venues;
      "
    env_file: .env

  # menu-site (Next.js) подключается отдельным образом:
  # menu-site:
  #   image: dostuk-menu-site:latest
  #   environment: { API_URL: http://api:8000/api/v1 }

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
